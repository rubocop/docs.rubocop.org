name: Publish to GitHub Pages
on:
  push:
    branches: [master]
  # Sent by a project's release workflow, with the project and the new tag in
  # the payload, to add the release to the playbook and publish it right away.
  repository_dispatch:
    types: [release]
  # Allows you to run this workflow manually from the Actions tab, optionally
  # adding a release the same way.
  workflow_dispatch:
    inputs:
      project:
        description: "Released project, as in its repository name (e.g. rubocop)"
        required: false
      tag:
        description: "Release tag to add to the playbook (e.g. v1.93.0)"
        required: false
concurrency:
  group: github-pages
  cancel-in-progress: false
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write  # to push the playbook update for a release
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PROJECT: ${{ github.event.client_payload.project || inputs.project }}
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # The site is built from this checkout, so the release gets published by
      # this run. A push made with GITHUB_TOKEN doesn't start another one.
      - name: Add the release to the playbook
        if: env.TAG != '' && github.ref == 'refs/heads/master'
        run: |
          message=$(node add-release.mjs "$PROJECT" "$TAG")
          if [ -n "$message" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "$message"
            git push origin HEAD:master
          fi
      - name: Install Antora
        run: npm ci
      - name: Generate Site
        run: npx antora antora-playbook.yml
      - name: Generate Redirects
        run: bash generate-redirects.sh
      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
